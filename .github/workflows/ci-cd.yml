name: CI/CD - YanXiDao Client (Web & Windows Desktop)

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]

jobs:
  verify-web-and-server:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci
      - run: npm run typecheck
      - run: npm run build
      - uses: actions/upload-artifact@v4
        with:
          name: web-dist
          path: dist/

  build-windows-desktop:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: verify-web-and-server
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci
      - run: npm run electron:build -- --publish never
      - name: Upload installer to GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $tag = "${{ github.ref_name }}"
          gh release view $tag *> $null
          if ($LASTEXITCODE -ne 0) {
            gh release create $tag --title "研习岛 Windows 客户端 $tag" --generate-notes
          }
          $files = @(Get-ChildItem -Path "release" -Filter "*.exe")
          if ($files.Count -eq 0) {
            throw "No .exe installer found in release/"
          }
          foreach ($file in $files) {
            gh release upload $tag $file.FullName --clobber
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }
      - uses: actions/upload-artifact@v4
        with:
          name: windows-installer
          path: release/*.exe
