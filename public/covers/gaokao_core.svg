<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 800" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3A0007" />
      <stop offset="50%" stop-color="#1A0003" />
      <stop offset="100%" stop-color="#0F0C08" />
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFE000" />
      <stop offset="50%" stop-color="#F7971E" />
      <stop offset="100%" stop-color="#FFD200" />
    </linearGradient>
    <linearGradient id="badgeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#E52D27" />
      <stop offset="100%" stop-color="#B31217" />
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="6" flood-color="#000" flood-opacity="0.5" />
    </filter>
  </defs>

  <!-- Background -->
  <rect width="600" height="800" rx="8" fill="url(#bgGrad)" />

  <!-- Book Spine 3D Effect -->
  <rect x="0" y="0" width="24" height="800" fill="#ffffff" fill-opacity="0.07" />
  <line x1="24" y1="0" x2="24" y2="800" stroke="#000000" stroke-opacity="0.4" stroke-width="2" />

  <!-- Top Curriculum Tag -->
  <rect x="50" y="45" width="240" height="26" rx="4" fill="#E52D27" fill-opacity="0.25" stroke="#E52D27" stroke-width="1.5" />
  <text x="62" y="63" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', PingFang SC, 'Microsoft YaHei', sans-serif" font-size="13" font-weight="700" fill="#FF8E8B">新高考新题型 · 核心考点突破</text>

  <!-- Top Right Badge -->
  <g transform="translate(460, 40)" filter="url(#shadow)">
    <circle cx="45" cy="45" r="42" fill="url(#badgeGrad)" stroke="#FFE000" stroke-width="2.5" />
    <text x="45" y="38" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', PingFang SC, 'Microsoft YaHei', sans-serif" font-size="13" font-weight="800" fill="#FFFFFF">高考冲刺</text>
    <text x="45" y="58" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', PingFang SC, 'Microsoft YaHei', sans-serif" font-size="18" font-weight="900" fill="#FFE000">140+特训</text>
  </g>

  <!-- Decorative Rings -->
  <circle cx="500" cy="400" r="180" fill="#FF512F" fill-opacity="0.04" />
  <path d="M 50 160 L 550 160" stroke="#ffffff" stroke-opacity="0.15" stroke-width="1" />

  <!-- English Titles -->
  <text x="50" y="230" font-family="'Helvetica Neue', Arial, sans-serif" font-size="52" font-weight="900" fill="#FFFFFF" letter-spacing="2">ENGLISH</text>
  <text x="50" y="275" font-family="'Helvetica Neue', Arial, sans-serif" font-size="19" font-weight="700" fill="#FF9A8B" letter-spacing="3">GAOKAO ESSENTIAL SYNTAX &amp; WRITING</text>

  <!-- Chinese Titles -->
  <text x="50" y="370" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', PingFang SC, 'Microsoft YaHei', sans-serif" font-size="46" font-weight="900" fill="#FFFFFF">高考英语</text>
  <text x="50" y="435" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', PingFang SC, 'Microsoft YaHei', sans-serif" font-size="32" font-weight="800" fill="url(#goldGrad)">核心满分句型与读后续写突破</text>

  <!-- Highlight Box -->
  <g transform="translate(50, 480)">
    <rect width="500" height="150" rx="12" fill="#1C090C" fill-opacity="0.85" stroke="#4A181F" stroke-width="1.5" />
    
    <circle cx="30" cy="38" r="6" fill="#FFE000" />
    <text x="48" y="43" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', PingFang SC, 'Microsoft YaHei', sans-serif" font-size="15" font-weight="600" fill="#F1F5F9">三大复杂从句与非谓语动词高分句式构建</text>

    <circle cx="30" cy="78" r="6" fill="#FF8E8B" />
    <text x="48" y="83" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', PingFang SC, 'Microsoft YaHei', sans-serif" font-size="15" font-weight="600" fill="#F1F5F9">新高考读后续写动作链条与情绪升华表达</text>

    <circle cx="30" cy="118" r="6" fill="#38ef7d" />
    <text x="48" y="123" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', PingFang SC, 'Microsoft YaHei', sans-serif" font-size="15" font-weight="600" fill="#F1F5F9">真题语法填空 &amp; 应用文写作高分提炼模版</text>
  </g>

  <!-- Footer -->
  <g transform="translate(50, 710)">
    <line x1="0" y1="0" x2="500" y2="0" stroke="#ffffff" stroke-opacity="0.15" stroke-width="1" />
    <text x="0" y="35" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', PingFang SC, 'Microsoft YaHei', sans-serif" font-size="15" font-weight="700" fill="#94A3B8">研习岛高考教研组 · 特别策划</text>
    <text x="500" y="35" text-anchor="end" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', PingFang SC, 'Microsoft YaHei', sans-serif" font-size="14" font-weight="600" fill="#64748B">高三年级 · 冲刺专修</text>
  </g>
</svg>
