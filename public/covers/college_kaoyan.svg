<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 800" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGradKy" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#141414" />
      <stop offset="50%" stop-color="#0A0A0A" />
      <stop offset="100%" stop-color="#000000" />
    </linearGradient>
    <linearGradient id="goldKy" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFDF00" />
      <stop offset="50%" stop-color="#F39C12" />
      <stop offset="100%" stop-color="#D35400" />
    </linearGradient>
    <filter id="shadowKy" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="6" flood-color="#000" flood-opacity="0.6" />
    </filter>
  </defs>

  <!-- Background -->
  <rect width="600" height="800" rx="8" fill="url(#bgGradKy)" />

  <!-- Book Spine 3D Effect -->
  <rect x="0" y="0" width="24" height="800" fill="#ffffff" fill-opacity="0.08" />
  <line x1="24" y1="0" x2="24" y2="800" stroke="#000000" stroke-opacity="0.4" stroke-width="2" />

  <!-- Top Tag -->
  <rect x="50" y="45" width="260" height="26" rx="4" fill="#F39C12" fill-opacity="0.2" stroke="#F39C12" stroke-width="1.5" />
  <text x="62" y="63" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', PingFang SC, 'Microsoft YaHei', sans-serif" font-size="13" font-weight="700" fill="#F39C12">全国硕士研究生招生考试 · 统考英语</text>

  <!-- Top Right Badge -->
  <g transform="translate(460, 40)" filter="url(#shadowKy)">
    <circle cx="45" cy="45" r="42" fill="#B91C1C" stroke="#F59E0B" stroke-width="2.5" />
    <text x="45" y="38" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', PingFang SC, 'Microsoft YaHei', sans-serif" font-size="13" font-weight="800" fill="#FFFFFF">考研英语</text>
    <text x="45" y="58" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', PingFang SC, 'Microsoft YaHei', sans-serif" font-size="18" font-weight="900" fill="#FDE047">80+上岸</text>
  </g>

  <!-- Title Section -->
  <path d="M 50 160 L 550 160" stroke="#ffffff" stroke-opacity="0.15" stroke-width="1" />
  <text x="50" y="230" font-family="'Helvetica Neue', Arial, sans-serif" font-size="50" font-weight="900" fill="#FFFFFF" letter-spacing="2">POSTGRADUATE</text>
  <text x="50" y="275" font-family="'Helvetica Neue', Arial, sans-serif" font-size="19" font-weight="700" fill="#F59E0B" letter-spacing="3">ACADEMIC SYNTAX &amp; READING ANALYSIS</text>

  <text x="50" y="370" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', PingFang SC, 'Microsoft YaHei', sans-serif" font-size="44" font-weight="900" fill="#FFFFFF">考研英语</text>
  <text x="50" y="435" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', PingFang SC, 'Microsoft YaHei', sans-serif" font-size="32" font-weight="800" fill="url(#goldKy)">核心长难句精解与真题突破</text>

  <!-- Feature Tags -->
  <g transform="translate(50, 480)">
    <rect width="500" height="150" rx="12" fill="#171717" fill-opacity="0.9" stroke="#333333" stroke-width="1.5" />
    
    <circle cx="30" cy="38" r="6" fill="#F59E0B" />
    <text x="48" y="43" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', PingFang SC, 'Microsoft YaHei', sans-serif" font-size="15" font-weight="600" fill="#F1F5F9">五步长难句拆分法：找主谓 / 断从句 / 理逻辑</text>

    <circle cx="30" cy="78" r="6" fill="#EF4444" />
    <text x="48" y="83" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', PingFang SC, 'Microsoft YaHei', sans-serif" font-size="15" font-weight="600" fill="#F1F5F9">十年考研真题阅读 Text 核心复杂复合句透析</text>

    <circle cx="30" cy="118" r="6" fill="#10B981" />
    <text x="48" y="123" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', PingFang SC, 'Microsoft YaHei', sans-serif" font-size="15" font-weight="600" fill="#F1F5F9">图画 / 图表大作文高级逻辑承转与论述升华</text>
  </g>

  <!-- Footer -->
  <g transform="translate(50, 710)">
    <line x1="0" y1="0" x2="500" y2="0" stroke="#ffffff" stroke-opacity="0.15" stroke-width="1" />
    <text x="0" y="35" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', PingFang SC, 'Microsoft YaHei', sans-serif" font-size="15" font-weight="700" fill="#94A3B8">研习岛考研英语教研团队 · 权威编著</text>
    <text x="500" y="35" text-anchor="end" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', PingFang SC, 'Microsoft YaHei', sans-serif" font-size="14" font-weight="600" fill="#64748B">英语（一）/ 英语（二）通用</text>
  </g>
</svg>
