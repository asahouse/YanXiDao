<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 800" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGradCet4" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#002244" />
      <stop offset="50%" stop-color="#001833" />
      <stop offset="100%" stop-color="#050C1A" />
    </linearGradient>
    <linearGradient id="cyanGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00F2FE" />
      <stop offset="100%" stop-color="#4FACFE" />
    </linearGradient>
    <linearGradient id="goldGradCet4" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFE000" />
      <stop offset="100%" stop-color="#799F0C" />
    </linearGradient>
    <filter id="shadow4" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="6" flood-color="#000" flood-opacity="0.4" />
    </filter>
  </defs>

  <!-- Background -->
  <rect width="600" height="800" rx="8" fill="url(#bgGradCet4)" />

  <!-- Book Spine 3D Effect -->
  <rect x="0" y="0" width="24" height="800" fill="#ffffff" fill-opacity="0.08" />
  <line x1="24" y1="0" x2="24" y2="800" stroke="#000000" stroke-opacity="0.4" stroke-width="2" />

  <!-- Top Ministry Tag -->
  <rect x="50" y="45" width="230" height="26" rx="4" fill="#00f2fe" fill-opacity="0.18" stroke="#00f2fe" stroke-width="1.5" />
  <text x="62" y="63" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', PingFang SC, 'Microsoft YaHei', sans-serif" font-size="13" font-weight="700" fill="#00f2fe">全国大学英语四级考试标准</text>

  <!-- Top Right Badge -->
  <g transform="translate(460, 40)" filter="url(#shadow4)">
    <circle cx="45" cy="45" r="42" fill="#0284c7" stroke="#38bdf8" stroke-width="2" />
    <text x="45" y="38" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', PingFang SC, 'Microsoft YaHei', sans-serif" font-size="13" font-weight="800" fill="#FFFFFF">CET-4</text>
    <text x="45" y="58" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', PingFang SC, 'Microsoft YaHei', sans-serif" font-size="18" font-weight="900" fill="#38ef7d">600+高分</text>
  </g>

  <!-- Title Section -->
  <path d="M 50 160 L 550 160" stroke="#ffffff" stroke-opacity="0.15" stroke-width="1" />
  <text x="50" y="230" font-family="'Helvetica Neue', Arial, sans-serif" font-size="52" font-weight="900" fill="#FFFFFF" letter-spacing="2">CET-4 SPRINT</text>
  <text x="50" y="275" font-family="'Helvetica Neue', Arial, sans-serif" font-size="19" font-weight="700" fill="#38bdf8" letter-spacing="3">COLLEGE ENGLISH TEST BAND 4</text>

  <text x="50" y="370" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', PingFang SC, 'Microsoft YaHei', sans-serif" font-size="44" font-weight="900" fill="#FFFFFF">大学英语四级</text>
  <text x="50" y="435" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', PingFang SC, 'Microsoft YaHei', sans-serif" font-size="32" font-weight="800" fill="url(#cyanGrad)">核心高频满分句型通关</text>

  <!-- Feature Tags -->
  <g transform="translate(50, 480)">
    <rect width="500" height="150" rx="12" fill="#041427" fill-opacity="0.85" stroke="#0e3a64" stroke-width="1.5" />
    
    <circle cx="30" cy="38" r="6" fill="#00f2fe" />
    <text x="48" y="43" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', PingFang SC, 'Microsoft YaHei', sans-serif" font-size="15" font-weight="600" fill="#E2E8F0">四级真题长对话与新闻听力关键句提炼</text>

    <circle cx="30" cy="78" r="6" fill="#38ef7d" />
    <text x="48" y="83" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', PingFang SC, 'Microsoft YaHei', sans-serif" font-size="15" font-weight="600" fill="#E2E8F0">选词填空与长篇阅读核心定位句速读</text>

    <circle cx="30" cy="118" r="6" fill="#facc15" />
    <text x="48" y="123" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', PingFang SC, 'Microsoft YaHei', sans-serif" font-size="15" font-weight="600" fill="#E2E8F0">汉译英传统文化考点 &amp; 议论文满分句模版</text>
  </g>

  <!-- Footer -->
  <g transform="translate(50, 710)">
    <line x1="0" y1="0" x2="500" y2="0" stroke="#ffffff" stroke-opacity="0.15" stroke-width="1" />
    <text x="0" y="35" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', PingFang SC, 'Microsoft YaHei', sans-serif" font-size="15" font-weight="700" fill="#94A3B8">高等教育大学英语四六级教研组</text>
    <text x="500" y="35" text-anchor="end" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', PingFang SC, 'Microsoft YaHei', sans-serif" font-size="14" font-weight="600" fill="#64748B">大一/大二 · 冲关必备</text>
  </g>
</svg>
